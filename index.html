<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gym SaaS</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

</head>
<body>

  <!-- AUTH -->

  <div id="authScreen" class="auth-screen">

    <div class="card auth-card">

      <h1>Gym SaaS</h1>

      <input
        type="email"
        id="email"
        placeholder="Correo"
      >

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
      >

      <input
        type="text"
        id="inviteCode"
        placeholder="Código invitación"
      >

      <button onclick="login()">
        Iniciar sesión
      </button>

      <button onclick="signUp()">
        Crear cuenta
      </button>

    </div>

  </div>

  <!-- APP -->

  <div id="appScreen" class="hidden">

    <div class="topbar">

      <button class="menu-btn" onclick="toggleSidebar()">
        ☰
      </button>

      <h1>Panel</h1>

    </div>

    <!-- SIDEBAR -->

    <aside id="sidebar" class="sidebar">

      <h2>Gym SaaS</h2>

      <button onclick="showSection('dashboard')">
        Dashboard
      </button>

      <button
        id="clientsBtn"
        onclick="showSection('clients')"
      >
        Clientes
      </button>

      <button
        id="routinesBtn"
        onclick="showSection('routines')"
      >
        Rutinas
      </button>

      <button
        id="codesBtn"
        onclick="showSection('codes')"
      >
        Códigos
      </button>

      <button onclick="showSection('profile')">
        Perfil
      </button>

      <button onclick="logout()">
        Salir
      </button>

    </aside>

    <!-- CONTENT -->

    <main class="main-content">

      <!-- DASHBOARD -->

      <section id="dashboardSection">

        <div class="card">

          <h2>Dashboard</h2>

          <div id="dashboardContent"></div>

        </div>

      </section>

      <!-- CLIENTS -->

      <section
        id="clientsSection"
        class="hidden"
      >

        <div class="card">

          <h2>Clientes</h2>

          <div id="clientsList"></div>

        </div>

      </section>

      <!-- ROUTINES -->

      <section
        id="routinesSection"
        class="hidden"
      >

        <div class="card">

          <h2>Rutinas</h2>

          <input
            type="text"
            id="routineName"
            placeholder="Nombre rutina"
          >

          <textarea
            id="routineExercises"
            placeholder="Ejercicios"
          ></textarea>

          <select id="routineClient"></select>

          <button onclick="createRoutine()">
            Crear rutina
          </button>

          <div id="routinesList"></div>

        </div>

      </section>

      <!-- CODES -->

      <section
        id="codesSection"
        class="hidden"
      >

        <div class="card">

          <h2>Códigos</h2>

          <button onclick="generateCode()">
            Generar código
          </button>

          <div id="codesList"></div>

        </div>

      </section>

      <!-- PROFILE -->

      <section
        id="profileSection"
        class="hidden"
      >

        <div class="card">

          <h2>Perfil</h2>

          <div id="profileData"></div>

        </div>

      </section>

    </main>

  </div>

  <script src="app.js"></script>

</body>
</html>
