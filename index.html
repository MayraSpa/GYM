<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym App</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>


<!-- LOGIN -->
<div id="authScreen" class="screen">

  <div class="authBox">

    <h1>Gym App</h1>

    <input type="email" id="email" placeholder="Correo">

    <input type="password" id="password" placeholder="Contraseña">

    <input type="text" id="inviteCode" placeholder="Código invitación">

    <button onclick="login()">
      Iniciar sesión
    </button>

    <button onclick="signUp()">
      Crear cuenta
    </button>

  </div>

</div>


<!-- PERFIL -->
<div id="profileSetupScreen" class="screen hidden">

  <div class="card">

    <h2>Completa tu perfil</h2>

    <input type="text" id="fullName" placeholder="Nombre completo">

    <input type="text" id="weight" placeholder="Peso">

    <input type="text" id="height" placeholder="Altura">

    <input type="text" id="age" placeholder="Edad">

    <input type="text" id="goal" placeholder="Objetivo">

    <button onclick="saveProfile()">
      Guardar perfil
    </button>

  </div>

</div>


<!-- ADMIN -->
<div id="adminDashboard" class="screen hidden">

  <div class="topBar">

    <button class="menuBtn"
    onclick="toggleSidebar('adminSidebar')">
      ☰
    </button>

    <h2>Panel Entrenador</h2>

  </div>


  <div id="adminSidebar" class="sidebar">

    <button onclick="showAdminSection('clientsSection')">
      Clientes
    </button>

    <button onclick="showAdminSection('codesSection')">
      Códigos
    </button>

    <button onclick="showAdminSection('templatesSection')">
      Rutinas
    </button>

    <button onclick="showAdminSection('assignSection')">
      Asignar
    </button>

    <button onclick="logout()">
      Cerrar sesión
    </button>

  </div>


  <div id="clientsSection" class="adminSection">

    <h2>Clientes</h2>

    <div id="clientsList"></div>

  </div>


  <div id="codesSection"
  class="adminSection hidden">

    <h2>Códigos</h2>

    <button onclick="generateCode()">
      Generar código
    </button>

    <div id="codesList"></div>

  </div>


  <div id="templatesSection"
  class="adminSection hidden">

    <h2>Crear rutina</h2>

    <input type="text"
    id="routineName"
    placeholder="Nombre rutina">

    <input type="text"
    id="exerciseName"
    placeholder="Ejercicio">

    <input type="text"
    id="exerciseSets"
    placeholder="Series">

    <input type="text"
    id="exerciseReps"
    placeholder="Repeticiones">

    <input type="text"
    id="exerciseRest"
    placeholder="Descanso">

    <button onclick="addExercise()">
      Agregar ejercicio
    </button>

    <div id="exercisePreview"></div>

    <button onclick="saveTemplate()">
      Guardar rutina
    </button>

    <div id="templatesList"></div>

  </div>


  <div id="assignSection"
  class="adminSection hidden">

    <h2>Asignar rutina</h2>

    <select id="assignClient"></select>

    <select id="assignTemplate"></select>

    <input type="text"
    id="weekLabel"
    placeholder="Semana 1">

    <button onclick="assignRoutine()">
      Asignar
    </button>

  </div>

</div>


<!-- CLIENT -->
<div id="clientDashboard" class="screen hidden">

  <div class="topBar">

    <button class="menuBtn"
    onclick="toggleSidebar('clientSidebar')">
      ☰
    </button>

    <h2 id="welcomeName"></h2>

  </div>


  <div id="clientSidebar" class="sidebar">

    <button onclick="showClientSection('routineSection')">
      Rutina
    </button>

    <button onclick="showClientSection('profileSection')">
      Perfil
    </button>

    <button onclick="logout()">
      Cerrar sesión
    </button>

  </div>


  <div id="routineSection" class="clientSection">

    <h2>Rutina semanal</h2>

    <div id="routineList"></div>

  </div>


  <div id="profileSection"
  class="clientSection hidden">

    <h2>Perfil</h2>

    <div id="profileData"></div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
