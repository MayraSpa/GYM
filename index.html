<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gym Pro</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

</head>
<body>

<!-- LOGIN -->

<div id="authScreen" class="auth-screen">

  <div class="login-card">

    <div class="logo-area">

      <h1>GYM PRO</h1>

      <p>
        Gestión completa de gimnasio
      </p>

    </div>

    <input
      type="email"
      id="email"
      placeholder="Correo electrónico"
    >

    <input
      type="password"
      id="password"
      placeholder="Contraseña"
    >

    <input
      type="text"
      id="inviteCode"
      placeholder="Código de invitación"
    >

    <button onclick="login()">
      Iniciar sesión
    </button>

    <button onclick="signUp()">
      Crear cuenta
    </button>

  </div>

</div>

<!-- APP -->

<div id="appScreen" class="hidden">

<header class="topbar">

  <button
    class="menu-btn"
    onclick="toggleSidebar()"
  >
    ☰
  </button>

  <h2>
    Gym Pro
  </h2>

  <div id="alertBadge">
    🔔
  </div>

</header>

<!-- SIDEBAR -->

<aside
  id="sidebar"
  class="sidebar"
>

  <div class="sidebar-logo">

    <h2>
      GYM PRO
    </h2>

  </div>

  <button
    onclick="showSection('dashboard')"
  >
    🏠 Dashboard
  </button>

  <button
    id="clientsBtn"
    onclick="showSection('clients')"
  >
    👥 Clientes
  </button>

  <button
    id="routinesBtn"
    onclick="showSection('routines')"
  >
    📅 Rutinas
  </button>

  <button
    id="paymentsBtn"
    onclick="showSection('payments')"
  >
    💰 Pagos
  </button>

  <button
    id="codesBtn"
    onclick="showSection('codes')"
  >
    🎟 Códigos
  </button>

  <button
    onclick="showSection('profile')"
  >
    ⚙ Perfil
  </button>

  <button
    onclick="logout()"
  >
    🚪 Salir
  </button>

</aside>

<main class="main-content">

<section id="dashboardSection">

<div class="stats-grid">

<div class="stat-card">

<h3>
Ingresos
</h3>

<span id="incomeCard">
$0
</span>

</div>

<div class="stat-card">

<h3>
Clientes
</h3>

<span id="clientsCard">
0
</span>

</div>

<div class="stat-card">

<h3>
Pagos pendientes
</h3>

<span id="pendingCard">
0
</span>

</div>

<div class="stat-card">

<h3>
Rutinas hoy
</h3>

<span id="routinesCard">
0
</span>

</div>

</div>

<div class="card">

<h2>
Alertas
</h2>

<div id="alertsContainer">
</div>

</div>

<div class="card">

<h2>
Actividad
</h2>

<div id="dashboardContent">
</div>

</div>

</section>
<!-- CLIENTES -->

<section
  id="clientsSection"
  class="hidden"
>

  <div class="card">

    <h2>
      Clientes
    </h2>

    <div
      id="clientsList"
      class="cards-grid"
    >
    </div>

  </div>

</section>

<!-- RUTINAS -->

<section
  id="routinesSection"
  class="hidden"
>

  <div class="card">

    <h2>
      Crear rutina
    </h2>

    <select id="routineClient">
    </select>

    <select id="routineDay">

      <option value="">
        Seleccionar día
      </option>

      <option value="Monday">
        Lunes
      </option>

      <option value="Tuesday">
        Martes
      </option>

      <option value="Wednesday">
        Miércoles
      </option>

      <option value="Thursday">
        Jueves
      </option>

      <option value="Friday">
        Viernes
      </option>

      <option value="Saturday">
        Sábado
      </option>

      <option value="Sunday">
        Domingo
      </option>

    </select>

    <input
      type="text"
      id="routineName"
      placeholder="Nombre de la rutina"
    >

    <textarea
      id="routineExercises"
      placeholder="Ejercicios"
    ></textarea>

    <button
      onclick="createRoutine()"
    >
      Guardar rutina
    </button>

  </div>

  <div
    id="routinesList"
    class="cards-grid"
  >
  </div>

</section>

<!-- PAGOS -->

<section
  id="paymentsSection"
  class="hidden"
>

  <div class="card">

    <h2>
      Gestión de pagos
    </h2>

    <select id="paymentClient">
    </select>

    <input
      type="number"
      id="monthlyAmount"
      placeholder="Mensualidad"
    >

    <input
      type="date"
      id="nextDueDate"
    >

    <button
      onclick="createPayment()"
    >
      Guardar mensualidad
    </button>

  </div>

  <div
    id="paymentsList"
    class="cards-grid"
  >
  </div>

</section>

<!-- CODIGOS -->

<section
  id="codesSection"
  class="hidden"
>

  <div class="card">

    <h2>
      Códigos de invitación
    </h2>

    <button
      onclick="generateCode()"
    >
      Generar código
    </button>

    <div id="codesList">
    </div>

  </div>

</section>
<!-- PERFIL -->

<section
  id="profileSection"
  class="hidden"
>

  <div class="card">

    <h2>
      Mi Perfil
    </h2>

    <div id="profileData">
    </div>

  </div>

</section>

</main>

<!-- MENU MOVIL -->

<nav class="mobile-nav">

  <button
    onclick="showSection('dashboard')"
  >
    🏠
  </button>

  <button
    onclick="showSection('clients')"
  >
    👥
  </button>

  <button
    onclick="showSection('routines')"
  >
    📅
  </button>

  <button
    onclick="showSection('payments')"
  >
    💰
  </button>

  <button
    onclick="showSection('profile')"
  >
    ⚙
  </button>

</nav>

</div>

<script src="app.js"></script>

</body>
</html>
