<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gym App</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>



<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<div
  id="authScreen"
  class="screen"
>

  <div class="authBox">

    <h1>Gym App</h1>

    <input
      type="email"
      id="email"
      placeholder="Correo"
    >

    <input
      type="password"
      id="password"
      placeholder="Contraseña"
    >

    <input
      type="text"
      id="inviteCode"
      placeholder="Código invitación"
    >

    <button onclick="login()">
      Iniciar sesión
    </button>

    <button onclick="signUp()">
      Crear cuenta
    </button>

  </div>

</div>



<!-- ========================= -->
<!-- PROFILE SETUP -->
<!-- ========================= -->

<div
  id="profileSetupScreen"
  class="screen hidden"
>

  <div class="profileBox">

    <h2>Completa tu perfil</h2>

    <input
      type="text"
      id="fullName"
      placeholder="Nombre completo"
    >

    <input
      type="text"
      id="weight"
      placeholder="Peso"
    >

    <input
      type="text"
      id="height"
      placeholder="Altura"
    >

    <input
      type="text"
      id="age"
      placeholder="Edad"
    >

    <input
      type="text"
      id="goal"
      placeholder="Objetivo"
    >

    <button onclick="saveProfile()">
      Guardar perfil
    </button>

  </div>

</div>



<!-- ========================= -->
<!-- ADMIN DASHBOARD -->
<!-- ========================= -->

<div
  id="adminDashboard"
  class="screen hidden"
>

  <div class="topBar">

    <button
      class="menuBtn"
      onclick="toggleSidebar('adminSidebar')"
    >
      ☰
    </button>

    <h2>Panel Entrenador</h2>

  </div>



  <!-- SIDEBAR -->

  <div
    id="adminSidebar"
    class="sidebar"
  >

    <button onclick="showAdminSection('adminClients')">
      Clientes
    </button>

    <button onclick="showAdminSection('adminTemplates')">
      Rutinas
    </button>

    <button onclick="showAdminSection('adminAssign')">
      Asignar Rutina
    </button>

    <button onclick="showAdminSection('adminCodes')">
      Códigos
    </button>

    <button onclick="logout()">
      Cerrar sesión
    </button>

  </div>



  <!-- CLIENTES -->

  <div
    id="adminClients"
    class="adminSection"
  >

    <h2>Clientes</h2>

    <div id="clientsList"></div>

  </div>



  <!-- RUTINAS -->

  <div
    id="adminTemplates"
    class="adminSection hidden"
  >

    <h2>Crear Rutina</h2>

    <input
      type="text"
      id="templateName"
      placeholder="Nombre rutina"
    >


    <div class="exerciseCreator">

      <input
        type="text"
        id="templateExercise"
        placeholder="Ejercicio"
      >

      <input
        type="text"
        id="templateSets"
        placeholder="Series"
      >

      <input
        type="text"
        id="templateReps"
        placeholder="Repeticiones"
      >

      <input
        type="text"
        id="templateDay"
        placeholder="Día"
      >

      <button onclick="addTemplateExercise()">
        Agregar
      </button>

    </div>


    <div id="templateExerciseList"></div>


    <button onclick="createTemplate()">
      Guardar rutina
    </button>


    <h2>Rutinas guardadas</h2>

    <div id="templatesList"></div>

  </div>



  <!-- ASIGNAR -->

  <div
    id="adminAssign"
    class="adminSection hidden"
  >

    <h2>Asignar Rutina</h2>

    <select id="assignClient"></select>

    <select id="assignTemplate"></select>

    <button onclick="assignTemplateToClient()">
      Asignar
    </button>

  </div>



  <!-- CODIGOS -->

  <div
    id="adminCodes"
    class="adminSection hidden"
  >

    <h2>Códigos Invitación</h2>

    <button onclick="generateCode()">
      Generar código
    </button>

    <div id="codesList"></div>

  </div>

</div>



<!-- ========================= -->
<!-- CLIENT DASHBOARD -->
<!-- ========================= -->

<div
  id="clientDashboard"
  class="screen hidden"
>

  <div class="topBar">

    <button
      class="menuBtn"
      onclick="toggleSidebar('clientSidebar')"
    >
      ☰
    </button>

    <h2 id="welcomeName"></h2>

  </div>



  <!-- SIDEBAR -->

  <div
    id="clientSidebar"
    class="sidebar"
  >

    <h3 id="sidebarUserName"></h3>

    <button onclick="showClientSection('clientExercises')">
      Rutina
    </button>

    <button onclick="showClientSection('clientProfile')">
      Perfil
    </button>

    <button onclick="logout()">
      Cerrar sesión
    </button>

  </div>



  <!-- EJERCICIOS -->

  <div
    id="clientExercises"
    class="clientSection"
  >

    <h2>Rutina semanal</h2>

    <div class="progressBar">

      <div id="progressFill"></div>

    </div>

    <p id="progressText">0%</p>

    <div id="exerciseList"></div>

  </div>



  <!-- PERFIL -->

  <div
    id="clientProfile"
    class="clientSection hidden"
  >

    <h2>Perfil</h2>

    <div id="profileData"></div>

  </div>

</div>



<script src="app.js"></script>

</body>
</html>
