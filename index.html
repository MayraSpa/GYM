<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Gym App
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

  <!-- LOGIN -->

  <div
    id="authScreen"
    class="center-screen"
  >

    <div class="card auth-card">

      <h1>
        Gym App
      </h1>

      <input
        type="email"
        id="email"
        placeholder="Correo"
      />

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
      />

      <input
        type="text"
        id="inviteCode"
        placeholder="Código invitación"
      />

      <button onclick="login()">
        Iniciar sesión
      </button>

      <button onclick="signUp()">
        Crear cuenta
      </button>

    </div>

  </div>


  <!-- APP -->

  <div
    id="appScreen"
    class="hidden"
  >

    <!-- SIDEBAR -->

    <aside
      id="sidebar"
      class="sidebar"
    >

      <div class="sidebar-top">

        <h2>
          Gym
        </h2>

        <button
          class="close-btn"
          onclick="toggleSidebar()"
        >
          ✕
        </button>

      </div>

      <button onclick="showSection('dashboard')">
        Dashboard
      </button>

      <button onclick="showSection('clients')">
        Clientes
      </button>

      <button onclick="showSection('routines')">
        Rutinas
      </button>

      <button onclick="showSection('profile')">
        Perfil
      </button>

      <button onclick="logout()">
        Cerrar sesión
      </button>

    </aside>


    <!-- CONTENT -->

    <main class="main-content">

      <!-- TOPBAR -->

      <div class="topbar">

        <button
          class="menu-btn"
          onclick="toggleSidebar()"
        >
          ☰
        </button>

        <h1>
          Panel Entrenador
        </h1>

      </div>


      <!-- DASHBOARD -->

      <section id="dashboardSection">

        <div class="card">

          <h2>
            Dashboard
          </h2>

          <p>
            Bienvenido
          </p>

        </div>

      </section>


      <!-- CLIENTES -->

      <section
        id="clientsSection"
        class="hidden"
      >

        <div class="card">

          <h2>
            Clientes
          </h2>

          <div id="clientsList"></div>

        </div>

      </section>


      <!-- RUTINAS -->

      <section
        id="routinesSection"
        class="hidden"
      >

        <!-- CREAR -->

        <div class="card">

          <h2>
            Crear rutina
          </h2>

          <input
            type="text"
            id="routineName"
            placeholder="Nombre rutina"
          />

          <textarea
            id="routineExercises"
            placeholder="Ejercicios..."
          ></textarea>

          <button onclick="createRoutine()">
            Guardar rutina
          </button>

        </div>


        <!-- CODIGOS -->

        <div class="card">

          <h2>
            Códigos Invitación
          </h2>

          <button onclick="generateCode()">
            Generar código
          </button>

          <div id="codesList"></div>

        </div>


        <!-- RUTINAS GUARDADAS -->

        <div class="card">

          <h2>
            Rutinas guardadas
          </h2>

          <div id="routinesList"></div>

        </div>

      </section>


      <!-- PERFIL -->

      <section
        id="profileSection"
        class="hidden"
      >

        <div class="card">

          <h2>
            Perfil
          </h2>

          <div id="profileData"></div>

        </div>

      </section>

    </main>

  </div>

  <script src="app.js"></script>

</body>
</html>
