<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gym App</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>



<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<div
  id="authScreen"
  class="screen"
>

  <div class="authBox">

    <h1>Gym App</h1>

    <input
      type="email"
      id="email"
      placeholder="Correo"
    >

    <input
      type="password"
      id="password"
      placeholder="Contraseña"
    >

    <input
      type="text"
      id="inviteCode"
      placeholder="Código invitación"
    >

    <button onclick="login()">
      Iniciar sesión
    </button>

    <button onclick="signUp()">
      Crear cuenta
    </button>

  </div>

</div>



<!-- ========================= -->
<!-- PROFILE SETUP -->
<!-- ========================= -->

<div
  id="profileSetupScreen"
  class="screen hidden"
>

  <div class="profileBox">

    <h2>Completa tu perfil</h2>

    <input
      type="text"
      id="fullName"
      placeholder="Nombre completo"
    >

    <input
      type="text"
      id="weight"
      placeholder="Peso"
    >

    <input
      type="text"
      id="height"
      placeholder="Altura"
    >

    <input
      type="text"
      id="age"
      placeholder="Edad"
    >

    <input
      type="text"
      id="goal"
      placeholder="Objetivo"
    >

    <button onclick="saveProfile()">
      Guardar perfil
    </button>

  </div>

</div>



<!-- ========================= -->
<!-- ADMIN DASHBOARD -->
<!-- ========================= -->

<div
  id="adminDashboard"
  class="screen hidden"
>

  <div class="topBar">

    <button
      class="menuBtn"
      onclick="toggleSidebar('adminSidebar')"
    >
      ☰
    </button>

    <h2>
      Panel Entrenador
    </h2>

  </div>



  <!-- SIDEBAR ADMIN -->

  <div
    id="adminSidebar"
    class="sidebar"
  >

    <button
      onclick="showAdminSection('adminClients')"
    >
      Clientes
    </button>

    <button
      onclick="showAdminSection('adminTemplates')"
    >
      Rutinas
    </button>

    <button
      onclick="showAdminSection('adminAssign')"
    >
      Asignar Rutina
    </button>

    <button
      onclick="showAdminSection('adminCodes')"
    >
      Códigos
    </button>

    <button onclick="logout()">
      Cerrar sesión
    </button>

  </div>
